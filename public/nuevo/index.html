<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>NOUM GESTIÓ DE TICKETS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <div class="brand-header">
      <img src="/logo-color-2-1.jpg" alt="Logo Barri Besòs" class="brand-logo" />
      <h1>NOUM GESTIÓ DE TICKETS</h1>
    </div>

    <form id="form-ticket" enctype="multipart/form-data">
      <label for="aula">Aula / ubicació</label>
      <select id="aula" name="aula_id" required></select>

      <label for="categoria">Categoria</label>
      <select id="categoria" name="categoria" required>
        <option value="">Selecciona...</option>
        <option value="Informàtica">Informàtica</option>
        <option value="Altres">Altres</option>
      </select>

      <label for="descripcion">Descripció del problema</label>
      <textarea id="descripcion" name="descripcion" rows="4" required placeholder="Descriu breument què passa..."></textarea>

      <label for="nombre_reportante">El teu nom</label>
      <input id="nombre_reportante" name="nombre_reportante" type="text" required placeholder="Nom i cognoms" />

      <label for="foto">Foto (opcional)</label>
      <input id="foto" name="foto" type="file" accept="image/*" capture="environment" />

      <button type="submit" id="btn-enviar">Enviar avís</button>
      <p id="error" class="error" hidden></p>
    </form>

    <section id="confirmacion" hidden>
      <h2>✅ Avís enviat</h2>
      <p>El teu avís s'ha registrat amb el número <strong id="ref-ticket"></strong>.</p>
      <p>L'equip de TI el revisarà el més aviat possible.</p>
      <button id="btn-nuevo">Crear un altre avís</button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
