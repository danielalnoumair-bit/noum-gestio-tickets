<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NOUM GESTIÓ DE TICKETS</title>
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <header class="topbar">
    <nav>
      <a href="/admin/" class="active">Tickets</a>
      <a href="/admin/aulas.html">Aulas / QR</a>
    </nav>
    <button id="btn-logout">Cerrar sesión</button>
  </header>

  <main>
    <section class="panel">
      <div class="filters">
        <div class="field">
          <label for="f-estado">Estat</label>
          <select id="f-estado">
            <option value="">Tots</option>
            <option value="abierto">Obert</option>
            <option value="en_proceso">En procés</option>
            <option value="resuelto">Resolts</option>
          </select>
        </div>
        <div class="field">
          <label for="f-categoria">Categoria</label>
          <select id="f-categoria">
            <option value="">Totes</option>
            <option value="Informàtica">Informàtica</option>
            <option value="Altres">Altres</option>
          </select>
        </div>
        <div class="field">
          <label for="f-aula">Aula</label>
          <select id="f-aula"><option value="">Totes</option></select>
        </div>
        <div class="field">
          <label for="f-q">Cerca</label>
          <input id="f-q" type="text" placeholder="Nom o descripció" />
        </div>
        <div class="field">
          <label for="f-desde">Des de</label>
          <input id="f-desde" type="date" />
        </div>
        <div class="field">
          <label for="f-hasta">Fins a</label>
          <input id="f-hasta" type="date" />
        </div>
        <div class="field">
          <button class="btn" id="btn-filtrar">Filtrar</button>
        </div>
        <div class="field">
          <a class="btn secondary" id="btn-exportar" href="/api/export">Exportar Excel</a>
        </div>
      </div>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Fecha</th>
            <th>Aula</th>
            <th>Categoría</th>
            <th>Reportado por</th>
            <th>Estado</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tbody-tickets"></tbody>
      </table>
      <p id="sin-resultados" hidden>No hi ha avisos amb aquests filtres.</p>
    </section>
  </main>

  <script src="admin.js"></script>
  <script src="tickets-list.js"></script>
</body>
</html>
