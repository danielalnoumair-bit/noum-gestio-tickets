<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Presupuestos</title>
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-brand">
      <img src="/logo-color-2-1-dark.png" alt="Logo del centro" class="topbar-logo" />
      <span class="topbar-title">INS Barri Besòs</span>
    </div>
    <nav>
      <a href="/admin/">Tickets</a>
      <a href="/admin/aulas.html">Aulas / QR</a>
      <a href="/admin/presupuestos.html" class="active">Presupuestos</a>
    </nav>
    <button id="btn-logout">Cerrar sesión</button>
  </header>

  <main>
    <section class="panel" id="panel-nuevo-presupuesto">
      <h2>Nuevo presupuesto</h2>
      <form id="form-nuevo-presupuesto" style="display:flex; gap:10px; align-items:end; flex-wrap:wrap;">
        <div class="field">
          <label for="p-concepto">Concepto</label>
          <input id="p-concepto" type="text" required placeholder="Ej. Reparación proyector aula 101" style="min-width:260px;" />
        </div>
        <div class="field">
          <label for="p-proveedor">Proveedor</label>
          <input id="p-proveedor" type="text" placeholder="Ej. Informàtica Besòs SL" />
        </div>
        <div class="field">
          <label for="p-importe">Importe (€)</label>
          <input id="p-importe" type="number" step="0.01" min="0" required />
        </div>
        <button class="btn" type="submit">Añadir</button>
      </form>
      <p class="error" id="error-presupuesto" hidden></p>
    </section>

    <section class="panel">
      <h2>Presupuestos</h2>
      <table>
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Concepto</th>
            <th>Proveedor</th>
            <th>Importe</th>
            <th>Estado</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tbody-presupuestos"></tbody>
      </table>
      <p id="sin-presupuestos" hidden>Todavía no hay presupuestos.</p>
    </section>
  </main>

  <script src="admin.js"></script>
  <script src="presupuestos.js"></script>
</body>
</html>
